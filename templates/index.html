<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keepfit - 卡路里紀錄</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { text-align: center; color: #333; margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #666; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; margin-top: 10px; }
        .btn-add { background-color: #28a745; color: white; }
        .btn-add:hover { background-color: #218838; }
        .btn-sync { background-color: #17a2b8; color: white; width: 48%; display: inline-block; }
        .table-container { margin-top: 25px; border-top: 2px solid #eee; padding-top: 15px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; }
        .total-section { text-align: right; margin-top: 15px; font-size: 1.2em; color: #d9534f; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>🍎 卡路里紀錄</h2>

    <div class="input-group">
        <label>選擇食物：</label>
<select id="foodSelect" onchange="autoFillCalorie()" style="width: 100%; padding: 8px; margin: 10px 0;">
    <option value="">-- 請選擇食物 --</option>
</select>

<label>卡路里 (kcal)：</label>
<input type="number" id="calories" placeholder="自動填入或手動修改">
    </div>

    <button class="btn-add" onclick="addEntry()">加入今日清單</button>

    <div style="display: flex; justify-content: space-between;">
        <button class="btn-sync" onclick="window.location.href='/export'">匯出 (Out)</button>
        <button class="btn-sync" style="background-color: #6c757d;" onclick="document.getElementById('importFile').click()">匯入 (In)</button>
        <input type="file" id="importFile" style="display:none" onchange="importData(this)">
    </div>

    <div class="table-container">
        <table>
            <thead><tr><th>食物</th><th>卡路里</th></tr></thead>
            <tbody id="recordBody"></tbody>
        </table>
        <div class="total-section">總計: <span id="totalCal">0</span> kcal</div>
    </div>
</div>

<script>
    let foodLibrary = [];

    // 1. 初始化：從 API 載入 200+ 條食物數據
    async function loadLibrary() {
        try {
            const res = await fetch('/get_food_library');
            foodLibrary = await res.json();
            const list = document.getElementById('foodList');
            list.innerHTML = "";
            foodLibrary.forEach(item => {
                let option = document.createElement('option');
                option.value = item.name;
                list.appendChild(option);
            });
            console.log("資料庫已載入，共 " + foodLibrary.length + " 條紀錄");
        } catch (e) {
            console.error("載入失敗:", e);
        }
    }

    // 2. 當用戶選擇食物時，自動填寫卡路里
    function checkFoodValue() {
        const val = document.getElementById('foodName').value;
        const found = foodLibrary.find(f => f.name === val);
        if (found) {
            document.getElementById('calories').value = found.cal;
        }
    }

    // 3. 新增紀錄
    async function addEntry() {
        const name = document.getElementById('foodName').value;
        const cal = document.getElementById('calories').value;
        if (!name || !cal) return alert("請輸入完整資料");

        await fetch('/add_record', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ name, cal: parseInt(cal) })
        });

        document.getElementById('foodName').value = "";
        document.getElementById('calories').value = "";
        loadRecords();
    }

    // 4. 顯示今日紀錄
    async function loadRecords() {
        const res = await fetch('/get_records');
        const data = await res.json();
        const body = document.getElementById('recordBody');
        let total = 0;
        body.innerHTML = data.map(r => {
            total += parseInt(r.cal);
            return `<tr><td>${r.name}</td><td>${r.cal}</td></tr>`;
        }).join('');
        document.getElementById('totalCal').innerText = total;
    }

    // 5. 匯入功能
    async function importData(input) {
        const formData = new FormData();
        formData.append('file', input.files[0]);
        await fetch('/import', { method: 'POST', body: formData });
        loadRecords();
        alert('匯入成功！');
    }

    // 啟動載入
    loadLibrary();
    loadRecords();
</script>

</body>
</html>
