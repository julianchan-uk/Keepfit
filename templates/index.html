<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keepfit 卡路里紀錄</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { text-align: center; color: #333; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #555; }
        select, input { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; margin-top: 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        .btn-add { background-color: #4CAF50; color: white; }
        .btn-add:hover { background-color: #45a049; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn-secondary { background-color: #17a2b8; color: white; flex: 1; }
        table { width: 100%; margin-top: 25px; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; }
        .total { text-align: right; font-weight: bold; color: #d9534f; font-size: 1.2em; margin-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🍎 卡路里紀錄</h2>

    <label>選擇食物 (200+ 數據)：</label>
    <select id="foodSelect" onchange="syncCalorie()">
        <option value="">-- 請選擇食物 --</option>
    </select>

    <label>卡路里 (kcal)：</label>
    <input type="number" id="calories" placeholder="揀選後自動填入">

    <button class="btn-add" onclick="addEntry()">加入今日清單</button>

    <div class="btn-group">
        <button class="btn-secondary" onclick="window.location.href='/export'">匯出 (Out)</button>
        <button class="btn-secondary" style="background-color: #6c757d;" onclick="alert('請手動將檔案放入 OMV 或上傳')">匯入 (In)</button>
    </div>

    <table id="recordTable">
        <thead>
            <tr><th>食物</th><th>卡路里</th></tr>
        </thead>
        <tbody></tbody>
    </table>

    <div class="total" id="totalCal">總計: 0 kcal</div>
</div>

<script>
    let library = [];

    // 1. 初始化：讀取食物資料庫
    fetch('/get_food_library')
        .then(res => res.json())
        .then(data => {
            library = data;
            const select = document.getElementById('foodSelect');
            data.forEach(item => {
                let opt = document.createElement('option');
                opt.value = item.name;
                opt.textContent = `${item.name} (${item.cal} kcal)`;
                select.appendChild(opt);
            });
        });

    // 2. 當選單改變，自動填寫卡路里
    function syncCalorie() {
        const selected = document.getElementById('foodSelect').value;
        const item = library.find(f => f.name === selected);
        document.getElementById('calories').value = item ? item.cal : "";
    }

    // 3. 新增紀錄到後端
    async function addEntry() {
        const name = document.getElementById('foodSelect').value || "手動輸入";
        const cal = document.getElementById('calories').value;
        if(!cal) return alert("請輸入卡路里");

        await fetch('/add_record', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ name, cal: parseInt(cal) })
        });
        
        loadRecords();
        document.getElementById('calories').value = "";
    }

    // 4. 讀取並顯示列表
    async function loadRecords() {
        const res = await fetch('/get_records');
        const data = await res.json();
        const tbody = document.querySelector('#recordTable tbody');
        let total = 0;
        
        tbody.innerHTML = data.map(r => {
            total += parseInt(r.cal);
            return `<tr><td>${r.name}</td><td>${r.cal} kcal</td></tr>`;
        }).join('');
        
        document.getElementById('totalCal').innerText = `總計: ${total} kcal`;
    }

    loadRecords();
</script>

</body>
</html>
